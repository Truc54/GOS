services:
  postgres:
    image: postgres:16-alpine
    container_name: gscores-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gscores
      POSTGRES_PASSWORD: gscores_password
      POSTGRES_DB: gscores_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gscores -d gscores_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
