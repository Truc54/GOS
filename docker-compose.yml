services:
  postgres:
    image: postgres:16-alpine
    container_name: gscores-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gscores
      POSTGRES_PASSWORD: gscores_password
      POSTGRES_DB: gscores_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gscores -d gscores_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gscores-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://gscores:gscores_password@postgres:5432/gscores_db?schema=public
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      CSV_FILE_PATH: /dataset/diem_thi_thpt_2024.csv
      AUTO_SEED: "true"
    ports:
      - "4000:4000"
    volumes:
      - ./dataset:/dataset:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: gscores-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local
